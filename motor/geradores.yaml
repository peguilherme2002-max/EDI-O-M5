  # F0.5 do cofre-de-leonida: amostra aprovada por Pedro em 2026-11-23 (inscreva-se → INSCRITO)
  - tipo: cta_botao
    gerador: m5.templates.cta_botao
    formatos: [longo]
    teto: ""
    status: aprovado

  # A4 do cofre-de-leonida: amostra técnica aprovada por Pedro em 2026-11-24
  # (mapa oficial como imagem web, com lista_item por cima). Imagem fica parada no segmento;
  # vídeo roda do início e repete. A mídia vem do manifest de assets (etiquetas).
  - tipo: midia_web
    gerador: m5.midia_web
    formatos: [longo]
    teto: "imagem fora de 16:9 fica com faixas pretas (sem zoom nem recorte)"
    status: aprovado

  # A4 do cofre-de-leonida: amostra aprovada por Pedro em 2026-11-24 (Trevor recortado sobre o gameplay).
  # Imagem: m5 recortar (Bing por scraping + rembg BiRefNet), registrada em assets/manifest.yaml (grupo recortes).
  # Entrada: clarão, zoom e contorno nas cores e tempos do kit; raios só com raios: true.
  - tipo: recorte_surpresa
    gerador: m5.templates.recorte_surpresa
    formatos: [longo]
    teto: "busca por scraping é frágil: se o Bing mudar, o comando para com erro; usar --url"
    status: aprovado

  # A4 do cofre-de-leonida: amostra aprovada por Pedro em 2026-11-24 (prévia do piloto com música).
  # Faixa contínua de assets/musica/ (ordem de nome, crossfade entre faixas), fade in/out,
  # ducking sob a narração (sidechaincompress). Liga só com kit audio.musica_volume_db.
  - tipo: musica_fundo
    gerador: m5.montagem (função _musica)
    formatos: [longo]
    teto: "escolhe a faixa só pela ordem de nome (todo vídeo curto usa a primeira); sem escolha por clima"
    status: aprovado
