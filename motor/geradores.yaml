# Registro de capacidades (doc 7.2) — tudo o que o motor sabe fazer.
# Escrita só com ordem explícita de Pedro, mostrando o diff, commit identificado (6.3).
# Um gerador só entra aqui depois de uma amostra aprovada por Pedro (F09).
#
# Campos por entrada:
#   tipo      — o que o roteiro pede. Tipos usados pela validação:
#               narracao | clipe_catalogo (visual.fonte=catalogo) | midia_web (visual.fonte=web)
#               | texto_tela | sfx | <nome do tipo gerado> (visual.fonte=gerado; vem em visual.busca)
#   gerador   — módulo do motor que produz o tipo
#   formatos  — lista: longo | short_roteiro_novo | short_recorte
#   teto      — limite conhecido de qualidade (vazio = nenhum); vira aviso antes do P2 (7.3)
#   status    — em_teste | aprovado (só "aprovado" conta na validação)
#
# Exemplo:
#   - tipo: contador
#     gerador: geradores/contador
#     formatos: [longo, short_roteiro_novo]
#     teto: ""
#     status: aprovado
#
# Nasce vazio na C2; cresce a cada etapa da construção (C3–C6) com amostra aprovada.

geradores:
  # C3, amostra aprovada por Pedro em 2026-11-23 (3 segmentos, ElevenLabs, com timestamps)
  # modo arquivo (dark_planner): interface pronta; detalhes no 1º uso real (doc 12)
  - tipo: narracao
    gerador: m5.narracao
    formatos: [longo, short_roteiro_novo]
    teto: ""
    status: aprovado

  # C4, amostra aprovada por Pedro em 2026-11-23 (Trailer 1, 0:30–1:00, 21 cenas, indexação 10,8 s)
  # limite do índice: a transcrição não é confiável em trechos só de música
  - tipo: clipe_catalogo
    gerador: m5.catalogo
    formatos: [longo, short_roteiro_novo]
    teto: ""
    status: aprovado

  # C5, amostra aprovada por Pedro em 2026-11-23 (1 min 16:9, prévia 480p + render 1080p)
  # entra quando a narração fala as palavras do texto (edl.py)
  - tipo: texto_tela
    gerador: m5.montagem (template texto_tela do kit)
    formatos: [longo]
    teto: ""
    status: aprovado

  # C6, amostra 9:16 aprovada por Pedro em 2026-11-23 (short de roteiro novo, 40,1 s)
  # layout 9:16: corte central; overlays nas laterais do material de origem podem ser cortados
  - tipo: texto_tela
    gerador: m5.montagem (template texto_tela do kit, layout 9:16)
    formatos: [short_roteiro_novo, short_recorte]
    teto: ""
    status: aprovado

  # F0.4/F0.5 do cofre-de-leonida: amostra aprovada por Pedro em 2026-11-23
  # (gameplay da orla, item 3 de 15). Medidas e cores vêm do kit de cada canal.
  - tipo: barra_progresso_lista
    gerador: m5.templates.barra_progresso_lista
    formatos: [longo]
    teto: ""      # contraste em cena clara resolvido com contorno opcional no kit (cofre: opção B)
    status: aprovado

  # F0.5 do cofre-de-leonida: amostra aprovada por Pedro em 2026-11-23 (versão fina, título de 24 caracteres)
  - tipo: lista_item
    gerador: m5.templates.lista_item
    formatos: [longo]
    teto: ""
    status: aprovado

  # F0.5 do cofre-de-leonida: amostra aprovada por Pedro em 2026-11-23 (212 GB / GTA VI / tamanho do jogo)
  - tipo: numero_gigante
    gerador: m5.templates.numero_gigante
    formatos: [longo]
    teto: ""
    status: aprovado

  # F0.5 do cofre-de-leonida: amostra aprovada por Pedro em 2026-11-23 (base subiu para y 970)
  - tipo: legenda_karaoke
    gerador: m5.templates.legenda_karaoke
    formatos: [longo]
    teto: ""
    status: aprovado

  # F0.5 do cofre-de-leonida: amostra aprovada por Pedro em 2026-11-23 (19 MI, dígito azul-marinho)
  - tipo: contador_flip
    gerador: m5.templates.contador_flip
    formatos: [longo]
    teto: ""
    status: aprovado

  # F0.5 do cofre-de-leonida: amostra aprovada por Pedro em 2026-11-23 (frase de teste, marca-texto)
  - tipo: citacao
    gerador: m5.templates.citacao
    formatos: [longo]
    teto: ""
    status: aprovado

  # F0.5 do cofre-de-leonida: amostras aprovadas por Pedro em 2026-11-23 (lavagem rápida; lavagem longa de reserva)
  - tipo: transicao_bloco
    gerador: m5.templates.transicao_bloco
